
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes REST API client for creating, viewing, and deleting notes.">
    <title>QuickNotes - System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>QuickNotes</h1>
            <p>A simple notes application powered by a REST API.</p>
        </header>

        <section class="panel" aria-labelledby="create-heading">
            <h2 id="create-heading">Create a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title</label>
                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                        placeholder="Enter a note title"
                    >
                    <small>Maximum 100 characters.</small>
                </div>

                <div class="form-group">
                    <label for="body-input">Note content</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="4"
                        required
                        placeholder="Write your note here"
                    ></textarea>
                </div>

                <button type="submit" id="submit-btn">Create note</button>
            </form>
        </section>

        <section class="panel" aria-labelledby="notes-heading">
            <div class="notes-header">
                <h2 id="notes-heading">Your notes</h2>
                <button type="button" id="load-btn">Load notes</button>
            </div>

            <p id="status" role="status" aria-live="polite">
                Select "Load notes" to retrieve notes from the server.
            </p>

            <ul id="notes-list" aria-label="Notes list"></ul>
        </section>

        <footer>
            <p>QuickNotes System Design Project</p>
        </footer>
    </main>
</body>
</html>
